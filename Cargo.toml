[workspace]
resolver = "2"
members = ["crates/core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license-file = "LICENSE"
authors = ["Lautaro Silva Sikora"]
repository = "https://github.com/Lautaro005/openblocks"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
