[package]
name = "openblocks-core"
description = "OpenBlocks core: local Markdown vault, search, links, previews, AI agents and the local HTTP/MCP servers"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "process", "io-util", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "charset", "http2", "query", "form"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
notify = "8"
walkdir = "2"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
calamine = { version = "0.30", features = ["dates"] }
rusqlite = { version = "0.37", features = ["bundled"] }
percent-encoding = "2"
bytes = "1"
anyhow = "1"
pdf-extract = "0.12.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
flate2 = "1.1.10"
tar = "0.4.46"
sha2 = "0.11.1"
lopdf = { version = "0.42.0", default-features = false }
rust_xlsxwriter = { version = "0.102.0", default-features = false }

[dev-dependencies]
tempfile = "3"
