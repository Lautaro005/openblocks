<script src="assets/site.js"></script>
<script>
// Renders CHANGELOG.md (copied here by the Pages workflow; falls back to GitHub).
(async () => {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2">$1</a>');
  let md = "";
  for (const url of ["CHANGELOG.md", "https://raw.githubusercontent.com/Lautaro005/openblocks/main/CHANGELOG.md"]) {
    try { const r = await fetch(url); if (r.ok) { md = await r.text(); break; } } catch {}
  }
  const out = [];
  let list = false, section = false;
  for (const line of md.split("\n")) {
    const close = () => { if (list) { out.push("</ul>"); list = false; } };
    let m;
    if ((m = /^## \[?([^\]\s]+)\]?\s*(?:[—-]\s*)?(.*)$/.exec(line))) {
      close(); if (section) out.push("</section>");
      out.push(`<section class="release"><h2>${esc(m[1])} <small>${esc(m[2])}</small></h2>`); section = true;
    } else if ((m = /^### (.*)$/.exec(line))) { close(); out.push(`<h3>${inline(m[1])}</h3>`); }
    else if ((m = /^\s*[-*] (.*)$/.exec(line))) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(m[1])}</li>`); }
    else if (line.trim() && !line.startsWith("# ")) { close(); out.push(`<p>${inline(line)}</p>`); }
    else close();
  }
  if (list) out.push("</ul>");
  if (section) out.push("</section>");
  document.getElementById("log").innerHTML = out.join("\n") || '<p class="muted">—</p>';
})();
</script>
