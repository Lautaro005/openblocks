name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles appimage,deb,rpm
          - name: windows-x64
            os: windows-latest
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: macOS signing identity
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # A signed bundle lets macOS remember what the user allowed (like a vault on a USB drive).
          # With the project's certificate the signature stays the same across versions, so the
          # permission also survives updates; without it (forks) the app is signed ad hoc.
          if [ -n "$MACOS_CERTIFICATE" ]; then
            KC="$RUNNER_TEMP/build.keychain-db"
            KP="$(openssl rand -hex 16)"
            printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KP" "$KC"
            security set-keychain-settings -lut 7200 "$KC"
            security unlock-keychain -p "$KP" "$KC"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/cert.p12"
            echo "APPLE_SIGNING_IDENTITY=OpenBlocks Code Signing" >> "$GITHUB_ENV"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: OpenBlocks v__VERSION__
          releaseBody: |
            Install from a terminal:

            - macOS / Linux: `curl -fsSL https://raw.githubusercontent.com/Lautaro005/openblocks/main/install.sh | sh`
            - Windows (PowerShell): `irm https://raw.githubusercontent.com/Lautaro005/openblocks/main/install.ps1 | iex`

            Or download the installer for your system below. What's new: https://lautaro005.github.io/openblocks/changelog.html
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: |
          APP="$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app | head -n1)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d -r- "$APP"
